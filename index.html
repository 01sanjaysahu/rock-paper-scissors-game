<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <main class="card">
    <h1>Rock · Paper · Scissors</h1>

    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">Wins</span>
        <span id="winsCount" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Losses</span>
        <span id="lossesCount" class="score-value">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Ties</span>
        <span id="tiesCount" class="score-value">0</span>
      </div>
    </div>

    <div class="arena">
      <div class="player-side">
        <div class="choice-display" id="playerDisplay">❓</div>
        <p class="side-label">You</p>
      </div>
      <div class="vs">VS</div>
      <div class="player-side">
        <div class="choice-display" id="computerDisplay">❓</div>
        <p class="side-label">Computer</p>
      </div>
    </div>

    <p id="resultMsg" class="result-msg">Make your move!</p>

    <div class="choices-row">
      <button class="choice-btn" data-choice="rock">🪨<span>Rock</span></button>
      <button class="choice-btn" data-choice="paper">📄<span>Paper</span></button>
      <button class="choice-btn" data-choice="scissors">✂️<span>Scissors</span></button>
    </div>

    <button id="resetBtn" class="reset-btn">Reset Score</button>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
